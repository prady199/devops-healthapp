apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthapp-blue
  labels:
    app: healthapp
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthapp
      version: blue
  template:
    metadata:
      labels:
        app: healthapp
        version: blue
    spec:
      containers:
      - name: healthapp
        image: prady200545/healthapp:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_COLOR
          value: "blue"
        - name: APP_VERSION
          value: "v1"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
